<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>12 — feather</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cdc6bc; }
      canvas { position: fixed; inset: 0; display: block; touch-action: none; }
      #bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: baseline;
        gap: 0.35em; white-space: nowrap; font: italic 14px Georgia, 'Times New Roman', serif; letter-spacing: 0.03em;
        color: #2f2b27; user-select: none; transition: opacity 0.4s; }
      #bar.hidden { opacity: 0; pointer-events: none; }
      #bar button { font: inherit; color: inherit; letter-spacing: inherit; background: none; border: 0; padding: 2px 4px;
        cursor: pointer; opacity: 0.5; transition: opacity 0.3s; }
      #bar button:hover { opacity: 0.85; }
      #bar button[aria-pressed='true'] { opacity: 0.95; text-decoration: underline; text-underline-offset: 3px; }
      #bar .sep { opacity: 0.3; }
      #bar .count { opacity: 0.6; min-width: 9.5em; text-align: center; }
      #bar .looks { opacity: 0.45; }
      #hint { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); font: italic 15px Georgia, serif;
        color: #2f2b27; opacity: 0.55; transition: opacity 1.2s; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="hint">pick it up and shake it</div>
    <nav id="bar"></nav>
    <!-- lets the folder run as-is on any static server, without the vite build;
         keep the version in sync with package.json -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
