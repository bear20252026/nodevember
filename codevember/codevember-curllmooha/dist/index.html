<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codevember 2026</title>
    <meta
      name="description"
      content="Thirty days of WebGPU experiments, one prompt a day."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --paper: #ecebe8;
        --tile: #e2e1dd;
        --ink: #1f1e1b;
        --muted: #8a8780;
        --line: #d3d1cb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          13px/1.4 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 1240px;
        margin-inline: auto;
        padding: clamp(28px, 6vw, 72px) clamp(16px, 4vw, 48px) 64px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        padding-bottom: 18px;
        margin-bottom: clamp(24px, 4vw, 40px);
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      h1 span,
      header p {
        color: var(--muted);
        font-weight: 400;
      }
      header p {
        margin: 0;
        text-align: right;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header a:hover {
        color: var(--ink);
      }

      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr));
        gap: clamp(16px, 2.4vw, 28px) clamp(10px, 1.6vw, 18px);
      }

      .tile {
        display: block;
      }

      .frame {
        display: block;
        aspect-ratio: 1;
        background: var(--tile);
        border-radius: 6px;
        overflow: hidden;
      }

      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .caption {
        display: flex;
        gap: 10px;
        padding-top: 9px;
        font-size: 12px;
      }

      .caption .n {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      a.tile:hover img {
        transform: scale(1.04);
      }
      a.tile:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
        border-radius: 6px;
      }

      /* days still to come: one quiet line, not a wall of empty frames */
      #soon {
        margin: clamp(40px, 6vw, 72px) 0 0;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 2;
      }
      #soon span {
        display: inline-block;
        margin-right: 18px;
        white-space: nowrap;
      }
      #soon b {
        font-weight: 400;
        margin-right: 6px;
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script type="module" crossorigin src="./assets/main-CXpMqErl.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-ulV_1b7r.js">
  </head>

  <body>
    <main>
      <header>
        <h1>Codevember <span>2026</span></h1>
        <p>
          <span id="count"></span> · by
          <a href="https://www.curllmooha.com">curllmooha</a>
        </p>
      </header>
      <ol id="days" aria-label="November 2026"></ol>
      <p id="soon"></p>
    </main>
  </body>
</html>
