<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tension</title>
    <meta
      name="description"
      content="Orb webs strung across the morning, glinting with dew. Flies, leaves and raindrops blow in, the silk stretches under them, and the spiders run to wrap what they caught."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #efe9dc;
        --dim: #efe9dc99;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1410;
        color: var(--ink);
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        opacity: 0;
        transition: opacity 0.9s;
      }
      body.ready canvas#view {
        opacity: 1;
      }
      canvas#view:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -3px;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        z-index: 2;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        right: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
      }
      #label {
        position: fixed;
        left: 24px;
        bottom: 26px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
        pointer-events: none;
        z-index: 2;
      }
      #label strong {
        font-weight: 500;
        font-size: 15px;
      }
      #label span {
        color: var(--dim);
      }
      #buttons {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        gap: 8px;
      }
      #buttons button {
        border: 1px solid #ffffff24;
        border-radius: 999px;
        padding: 10px 20px;
        background: #ffffff14;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 2px 10px #0004;
      }
      #buttons button:hover {
        background: #ffffff2a;
      }
      #buttons button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #veil {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0;
        z-index: 1;
        background: #030405;
      }
      body.capture :is(#title, #hint, #controls, #label, #buttons) {
        display: none;
      }
      @media (max-width: 600px) {
        #title {
          top: 64px;
        }
        #hint {
          top: 88px;
        }
        #label {
          bottom: 84px;
        }
      }
    </style>
    <script type="module" crossorigin src="../../assets/14-tension--JKur1JX.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-ulV_1b7r.js">
    <link rel="modulepreload" crossorigin href="../../assets/leva-C0l7872o.js">
    <link rel="modulepreload" crossorigin href="../../assets/stage-FtdQTM4C.js">
    <link rel="modulepreload" crossorigin href="../../assets/rendering-panel-Bn79TFs8.js">
  </head>
  <body>
    <div id="title">
      <a href="../../">Codevember</a><strong>14 Tension</strong>
    </div>
    <p id="hint">
      Things drift into the webs and the spiders come running. Click to throw
      something in, drag a thread to pull it. New webs moves on to the next
      place.
    </p>
    <p id="label" aria-live="polite"><strong></strong><span></span></p>
    <div id="buttons"><button id="random" type="button">New webs</button></div>
    <canvas id="veil" aria-hidden="true"></canvas>
    <div id="controls"></div>
  </body>
</html>
