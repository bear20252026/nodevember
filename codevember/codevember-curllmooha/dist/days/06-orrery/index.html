      :root {
        --ink: #2a241c;

      html,
      body {
        margin: 0;
        height: 100%;

        color: var(--ink);
        font:

      canvas {

      #title,
      #hint,
      #controls {
        opacity: 0;
        transition: opacity 1.2s 0.6s;
      }
      body.ready #title,
      body.ready #hint,
      body.ready #controls {
        opacity: 1;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        z-index: 2;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        right: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
      }
      #title,
      #hint {
        transition:
          color 0.8s,
          opacity 1.2s 0.6s;
      }
