<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moss</title>
    <meta
      name="description"
      content="A soft moss cushion with glass marbles resting in it."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #e8efe6;
        --dim: #e8efe688;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #03090f;
        color: var(--ink);
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #message {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        text-align: center;
        color: var(--dim);
        pointer-events: none;
      }
      #message:empty {
        display: none;
      }
      #dissolve {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        opacity: 0;
        pointer-events: none;
      }
      #bar-ui {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        gap: 2px;
        padding: 4px;
        border-radius: 22px;
        border: 1px solid #ffffff14;
        background: #08151cb0;
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 28px #0006;
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
        padding: 0 14px 0 11px;
        border: 0;
        border-radius: 18px;
        background: none;
        color: var(--dim);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition:
          color 0.2s,
          background 0.2s;
      }
      .choice svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .choice:hover {
        color: var(--ink);
        background: #ffffff10;
      }
      .choice[aria-pressed="true"],
      .choice[aria-pressed="true"]:hover {
        color: #10210f;
        background: #e9e2bf;
      }
      .choice:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
      }
      canvas#view {
        opacity: 0;
        transition: opacity 0.9s;
      }
      body.ready canvas#view {
        opacity: 1;
      }
      #title,
      #hint,
      #controls,
      #bar-ui {
        opacity: 0;
        transition: opacity 1.2s 0.6s;
      }
      body.ready #title,
      body.ready #hint,
      body.ready #controls,
      body.ready #bar-ui {
        opacity: 1;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
        transition: opacity 0.8s;
      }
    </style>
    <script type="module" crossorigin src="../../assets/05-moss-CTeru2h9.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-ulV_1b7r.js">
    <link rel="modulepreload" crossorigin href="../../assets/studio-presets-CDYyrMX7.js">
    <link rel="modulepreload" crossorigin href="../../assets/leva-C0l7872o.js">
    <link rel="modulepreload" crossorigin href="../../assets/stage-FtdQTM4C.js">
    <link rel="modulepreload" crossorigin href="../../assets/DepthOfFieldNode-D7JXNExi.js">
    <link rel="modulepreload" crossorigin href="../../assets/three-C2t3z6N3.js">
    <link rel="modulepreload" crossorigin href="../../assets/OrbitControls-VozILqJD.js">
    <link rel="modulepreload" crossorigin href="../../assets/rendering-panel-Bn79TFs8.js">
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="message"></p>
    <div id="title">
      <a href="../../">Codevember</a><strong>05 Moss</strong>
    </div>
    <p id="hint">
      Move over the moss to brush it, drag to orbit, double-click to dive in
    </p>
    <canvas id="dissolve"></canvas>
    <div id="bar-ui" role="group" aria-label="Scene">
      <button class="choice" id="btn-cinematic" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M2 4.5h8.5v7H2zM10.5 7l3.5-2v6l-3.5-2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          /></svg
        >Cinematic
      </button>
      <button class="choice" id="btn-rain" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 2.2c2.2 3 3.6 4.9 3.6 6.7a3.6 3.6 0 0 1-7.2 0C4.400 7.100 5.800 5.200 8 2.200z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          /></svg
        >Rain
      </button>
    </div>
    <div id="controls"></div>
  </body>
</html>
