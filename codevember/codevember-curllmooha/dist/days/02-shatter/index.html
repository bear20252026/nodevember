    <style>
      :root {
        --ink: #15171b;
        --dim: #15171b8a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f5f5;
        color: var(--ink);
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        transition: background 0.4s;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #tip {
        position: fixed;
        top: 16%;
        left: 50%;
        margin: 0;
        padding: 10px 18px;
        border-radius: 22px;
        color: #fff;
        background: var(--ink);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 6px);
        transition:
          opacity 0.4s,
          transform 0.4s;
      }
      #tip.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #random {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        min-height: 40px;
        padding: 0 22px;
        border: 0;
        border-radius: 20px;
        color: #fff;
        background: var(--ink);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 6px 22px #15171b26;
        transition: opacity 0.2s;
      }
      #random:hover {
        opacity: 0.85;
      }
      #random:focus-visible,
      #sound:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #sound {
        position: fixed;
        right: 24px;
        bottom: 22px;
        min-height: 40px;
        padding: 0 8px;
        border: 0;
        background: none;
        color: var(--dim);
        font: inherit;
        cursor: pointer;
        transition: color 0.2s;
      }
      #sound:hover {
        color: var(--ink);
      }
      @media (max-width: 620px) {
        #title {
          top: 62px;
          left: 18px;
        }
        #hint {
          top: 86px;
          left: 18px;
          right: 18px;
        }
        #sound {
          right: 10px;
          font-size: 13px;
        }
      }
    </style>
