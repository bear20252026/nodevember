<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirage</title>
    <meta
      name="description"
      content="On foot in a dune sea at noon. Ahead, the sand turns to water that holds the sky; walk toward it and it stays exactly as far away."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #fbf6ee;
        --dim: #fbf6eec2;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #c9b79c;
        text-shadow: 0 1px 6px #0006;
        color: var(--ink);
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        opacity: 0;
        transition: opacity 0.9s;
      }
      body.ready canvas#view {
        opacity: 1;
      }
      canvas#view:focus-visible {
        outline: none;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        z-index: 2;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        right: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
      }
      #buttons {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        gap: 8px;
      }
      #buttons button {
        border: 1px solid #4a342022;
        border-radius: 999px;
        padding: 10px 20px;
        background: #ffffff80;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 2px 10px #5a3a1c33;
      }
      #buttons button:hover {
        background: #ffffff40;
      }
      #buttons button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      body.capture :is(#title, #hint, #controls, #buttons) {
        display: none;
      }
      @media (max-width: 600px) {
        #title {
          top: 64px;
        }
        #hint {
          top: 88px;
        }
      }
      #placeForm {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 999px;
        background: #1a140f59;
        border: 1px solid #ffffff33;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      #placeForm input {
        width: min(56vw, 260px);
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        padding: 8px 14px;
      }
      #placeForm input::placeholder {
        color: var(--dim);
      }
      #placeForm button {
        border: 0;
        border-radius: 999px;
        padding: 8px 18px;
        background: #fbf6ee;
        color: #2a1f16;
        font: inherit;
        cursor: pointer;
      }
      #placeForm:focus-within {
        border-color: #ffffff80;
      }
      body.capture #placeForm {
        display: none;
      }
    </style>

    <link rel="modulepreload" crossorigin href="../../assets/leva-C0l7872o.js">
    <link rel="modulepreload" crossorigin href="../../assets/stage-FtdQTM4C.js">
    <link rel="modulepreload" crossorigin href="../../assets/three-C2t3z6N3.js">
    <link rel="modulepreload" crossorigin href="../../assets/BufferGeometryUtils-W3k5MhvD.js">
  </head>
  <body>
    <div id="title">
      <a href="../../">Codevember</a><strong>15 Mirage</strong>
    </div>
    <p id="hint">
      WASD to walk, shift to hurry, drag to look. E to ride the rally bike. The
      water out there is the sky.
    </p>
    <div id="buttons"><button id="ride">Ride the rally bike (E)</button></div>

    <div id="controls"></div>
  </body>
</html>
