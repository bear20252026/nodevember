<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magma</title>
    <meta name="description" content="A lump of lava floating in the dark: a glassy black crust, and only the cracks stay hot." />
    <link rel="icon" href="data:," />
    <style>
      :root { --ink: #f3e6dc; --dim: #f3e6dcaa; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0504; color: var(--ink); font: 14px/1.3 ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
      canvas#view:focus-visible { outline: none; }
      #title { position: fixed; top: 20px; left: 24px; display: flex; gap: 10px; align-items: baseline; z-index: 2; }
      #title a { color: var(--dim); text-decoration: none; }
      #title a:hover, #title a:focus-visible { color: var(--ink); text-decoration: underline; }
      #title strong { font-weight: 500; }
      #hint { position: fixed; top: 44px; left: 24px; right: 24px; margin: 0; color: var(--dim); pointer-events: none; max-width: 520px; }
      #bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 2; }
      #label { color: var(--ink); opacity: .75; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      #random { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 0; border-radius: 999px; background: #1f1d1bdd; color: #f4f1ec; font: 500 13px/1 inherit; cursor: pointer; backdrop-filter: blur(6px); box-shadow: 0 0 0 1px #ffffff1a; }
      #random:hover { background: #2a2826; }
      #random:focus-visible { outline: 2px solid #f4f1ec; outline-offset: 2px; }
      body.capture :is(#title, #hint, #controls, #bar) { display: none; }
    </style>
    <script type="module" src="/src/days/23-magma.js"></script>
  </head>
  <body>
    <div id="title"><a href="../../">Codevember</a><strong>23 Magma</strong></div>
    <p id="hint">Drag to turn it · click the stone to crack it open · R for another stone</p>
    <div id="bar"><span id="label"></span><button id="random" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Random</button></div>
    <div id="controls"></div>
  </body>
</html>
