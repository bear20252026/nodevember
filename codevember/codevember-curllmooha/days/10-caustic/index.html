<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caustic</title>
    <meta
      name="description"
      content="Drip acid on a sculpture in silver, gold, plastic or marble and watch it fizz, stain and etch the surface."
    />
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a09;
        color: #e8e2da;
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      canvas:focus-visible {
        outline: 2px solid #6d645c;
        outline-offset: -3px;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        z-index: 2;
      }
      #title a {
        color: #9a9087;
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: #fff;
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        right: 24px;
        margin: 0;
        color: #9a9087;
        pointer-events: none;
      }
      #touch-hint {
        display: none;
      }
      #fresh {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        padding: 9px 16px;
        border: 1px solid #ffffff32;
        border-radius: 999px;
        background: #1e1b18cc;
        color: #f5efe7;
        font: inherit;
        cursor: pointer;
      }
      #fresh:hover {
        background: #302922;
      }
      #fresh:focus-visible {
        outline: 2px solid #f5efe7;
        outline-offset: 3px;
      }
      #error,
      #loading {
        position: fixed;
        inset: 50% 24px auto;
        margin: 0;
        text-align: center;
      }
      body.capture :is(#title, #hint, #controls, #fresh, #loading) {
        display: none;
      }
      @media (max-width: 600px) {
        #title {
          top: 64px;
        }
        #hint {
          top: 88px;
        }
      }
      @media (pointer: coarse) {
        #mouse-hint {
          display: none;
        }
        #touch-hint {
          display: inline;
        }
      }
    </style>
    <script type="module" src="/src/days/10-caustic.js"></script>
  </head>
  <body>
    <canvas
      aria-label="A sculpture in a dark studio. Click it to drip acid, which fizzes, stains, smokes and eats into it."
      tabindex="0"
    ></canvas>
    <div id="title">
      <a href="../../">Codevember</a><strong>10 Caustic</strong>
    </div>
    <p id="hint">
      <span id="mouse-hint"
        >Click to drip. Hold to pour. Drag the background to orbit.</span
      >
      <span id="touch-hint"
        >Tap to drip. Hold to pour. Drag the background to orbit.</span
      >
    </p>
    <div id="controls"></div>
    <button id="fresh" type="button" hidden>Fresh piece</button>
    <p id="loading" role="status">Preparing the sculpture…</p>
    <p id="error" role="alert" hidden></p>
  </body>
</html>
