<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Series</title>
    <meta
      name="description"
      content="A sheet of paper folding in half forever, and never getting smaller."
    />
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #a9def8;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
      }
      #back {
        position: fixed;
        top: 18px;
        left: 20px;
        color: #fff;
        mix-blend-mode: difference;
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        text-decoration: none;
        opacity: 0.75;
      }
      #back:hover,
      #back:focus-visible {
        opacity: 1;
        text-decoration: underline;
      }
      /* Light, as some of these backdrops are nearly black. */
      #random {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        min-height: 40px;
        padding: 0 22px;
        border: 0;
        border-radius: 20px;
        color: #15171b;
        background: #fff;
        font:
          500 14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        cursor: pointer;
        box-shadow: 0 6px 22px #15171b26;
        transition: opacity 0.2s;
      }
      #random:hover {
        opacity: 0.85;
      }
      #random:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      @media (max-width: 460px) {
        #back {
          top: 62px;
        }
      }
    </style>
    <script type="module" src="/src/days/01-fold.js"></script>
  </head>
  <body>
    <a id="back" href="../../">Codevember</a>
    <button id="random" type="button">Random</button>
    <div id="controls"></div>
  </body>
</html>
