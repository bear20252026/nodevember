<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membrane</title>
    <meta
      name="description"
      content="Stretch a translucent membrane and watch air bubbles drift through the gel."
    />
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f6f3;
        color: #192e35;
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      canvas:focus-visible {
        outline: 2px solid #287987;
        outline-offset: -3px;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        z-index: 2;
      }
      #title a {
        color: #425a60;
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: #192e35;
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        right: 24px;
        margin: 0;
        color: #425a60;
        pointer-events: none;
      }
      #touch-hint {
        display: none;
      }
      #status {
        position: fixed;
        inset: 50% 24px auto;
        margin: 0;
        text-align: center;
      }
      body.capture :is(#title, #hint, #controls) {
        display: none;
      }
      @media (max-width: 600px) {
        #title {
          top: 64px;
        }
        #hint {
          top: 88px;
        }
      }
      @media (pointer: coarse) {
        #mouse-hint {
          display: none;
        }
        #touch-hint {
          display: inline;
        }
      }
    </style>
    <script type="module" src="/src/days/09-membrane.js"></script>
  </head>
  <body>
    <canvas
      aria-label="Interactive gel membrane. Press Space to pulse, or use the arrow keys to orbit."
      tabindex="0"
    ></canvas>
    <div id="title">
      <a href="../../">Codevember</a><strong>09 Membrane</strong>
    </div>
    <p id="hint">
      <span id="mouse-hint"
        >Drag to stretch. Shift-drag to orbit. Scroll to zoom.</span
      >
      <span id="touch-hint"
        >Drag the gel to stretch. Drag outside it to orbit.</span
      >
    </p>
    <div id="controls"></div>
    <p id="status" role="status" hidden></p>
  </body>
</html>
