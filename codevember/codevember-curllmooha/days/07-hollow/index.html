<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow</title>
    <meta
      name="description"
      content="An Earth in space with one glowing opening at its pole: fly in to a molten world inside, where a red-hot core drips lava onto the ground."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #f1ebe0;
        --dim: #f1ebe0a0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #020306;
        color: var(--ink);
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        opacity: 0;
        transition: opacity 1.4s;
      }
      body.ready canvas {
        opacity: 1;
      }
      #message {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        text-align: center;
        color: var(--dim);
        pointer-events: none;
      }
      #message:empty {
        display: none;
      }
      #title,
      #hint,
      #bar,
      #controls {
        opacity: 0;
        transition: opacity 1.4s 0.8s;
      }
      body.ready #title,
      body.ready #hint,
      body.ready #bar,
      body.ready #controls {
        opacity: 1;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        z-index: 2;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        right: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
      }
      #bar {
        position: fixed;
        left: 24px;
        bottom: 22px;
        display: flex;
        gap: 8px;
        z-index: 2;
      }
      #bar button {
        font: inherit;
        color: var(--ink);
        background: #ffffff10;
        border: 1px solid #f1ebe033;
        border-radius: 999px;
        padding: 7px 14px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      #bar button:hover,
      #bar button:focus-visible {
        background: #ffffff22;
        border-color: #f1ebe077;
        outline: none;
      }
      #bar button[aria-pressed="true"] {
        background: #f1ebe0;
        color: #10131a;
      }
      body.capture #title,
      body.capture #hint,
      body.capture #bar {
        display: none;
      }
    </style>
    <script type="module" src="/src/days/07-hollow.js"></script>
  </head>
  <body>
    <p id="message"></p>
    <div id="title">
      <a href="../../">Codevember</a><strong>07 Hollow</strong>
    </div>
    <p id="hint">Drag to look around</p>
    <div id="controls"></div>
  </body>
</html>
