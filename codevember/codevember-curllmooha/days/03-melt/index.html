<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melt</title>
    <meta
      name="description"
      content="Three scoops in a waffle cone, slowly melting."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #1f2527;
        --dim: #1f252799;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #79c6c4;
        color: var(--ink);
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #message {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        text-align: center;
        color: var(--dim);
        pointer-events: none;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #random {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        min-height: 40px;
        padding: 0 22px;
        border: 0;
        border-radius: 20px;
        color: #fff;
        background: var(--ink);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 6px 22px #1f252726;
        transition: opacity 0.2s;
      }
      #random:hover {
        opacity: 0.85;
      }
      #random:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      @media (max-width: 620px) {
        #title {
          top: 62px;
          left: 18px;
        }
        #hint {
          top: 86px;
          left: 18px;
          right: 18px;
        }
      }
    </style>
    <script type="module" src="/src/days/03-melt.js"></script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p id="message">Loading</p>
    <div id="title">
      <a href="../../">Codevember</a><strong>03 Melt</strong>
    </div>
    <p id="hint">Drag to look around</p>
    <button id="random" type="button">Random</button>
    <div id="controls"></div>
  </body>
</html>
