<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo</title>
    <meta name="description" content="A pitch-black cave you can only see by the echo of your own clicks." />
    <link rel="icon" href="data:," />
    <style>
      :root { --ink: #e9eef2; --dim: #e9eef299; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #010103; color: var(--ink); font: 14px/1.3 ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
      canvas#view:focus-visible { outline: none; }
      #title { position: fixed; top: 20px; left: 24px; display: flex; gap: 10px; align-items: baseline; z-index: 2; }
      #title a { color: var(--dim); text-decoration: none; }
      #title a:hover, #title a:focus-visible { color: var(--ink); text-decoration: underline; }
      #title strong { font-weight: 500; }
      #hint { position: fixed; top: 44px; left: 24px; right: 24px; margin: 0; color: var(--dim); pointer-events: none; max-width: 520px; }
      #bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 2; }
      #sound { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 0; border-radius: 999px; background: #1f1d1bdd; color: #f4f1ec; font: 500 13px/1 inherit; cursor: pointer; backdrop-filter: blur(6px); box-shadow: 0 0 0 1px #ffffff1a; }
      #sound:hover { background: #2a2826; }
      #sound:focus-visible { outline: 2px solid #f4f1ec; outline-offset: 2px; }
      body.capture :is(#title, #hint, #controls, #bar) { display: none; }
    </style>
    <script type="module" src="/src/days/22-echo.js"></script>
  </head>
  <body>
    <div id="title"><a href="../../">Codevember</a><strong>22 Echo</strong></div>
    <p id="hint">The cave only exists where your click's echo reaches · click to aim a click · space to click · turn sound on to hear the echoes</p>
    <div id="bar"><button id="sound" type="button" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span>Sound off</span></button></div>
    <div id="controls"></div>
  </body>
</html>
