<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feather</title>
    <meta
      name="description"
      content="A round creature thatched with thousands of feathers. Click it and it puffs itself up; press and hold to blow air through its coat."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #2a2522;
        --dim: #2a252299;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e7e6e3;
        color: var(--ink);
        font:
          14px/1.3 ui-sans-serif,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        transition: background 0.6s;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        opacity: 0;
        transition: opacity 0.9s;
      }
      body.ready canvas#view {
        opacity: 1;
      }
      canvas#view:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: -3px;
      }
      #title {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        z-index: 2;
      }
      #title a {
        color: var(--dim);
        text-decoration: none;
      }
      #title a:hover,
      #title a:focus-visible {
        color: var(--ink);
        text-decoration: underline;
      }
      #title strong {
        font-weight: 500;
      }
      #hint {
        position: fixed;
        top: 44px;
        left: 24px;
        right: 24px;
        margin: 0;
        color: var(--dim);
        pointer-events: none;
      }
      #label {
        position: fixed;
        left: 24px;
        bottom: 26px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
        pointer-events: none;
        z-index: 2;
      }
      #label strong {
        font-weight: 500;
        font-size: 15px;
      }
      #label span {
        color: var(--dim);
      }
      #buttons {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        gap: 8px;
      }
      #buttons button {
        border: 1px solid #2a252224;
        border-radius: 999px;
        padding: 10px 20px;
        background: #ffffff8c;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 2px 10px #2a252214;
      }
      #buttons button:hover {
        background: #ffffffc0;
      }
      #buttons button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      body.capture :is(#title, #hint, #controls, #label, #buttons) {
        display: none;
      }
      @media (max-width: 600px) {
        #title {
          top: 64px;
        }
        #hint {
          top: 88px;
        }
        #label {
          bottom: 84px;
        }
      }
    </style>
    <script type="module" src="/src/days/12-feather.js"></script>
  </head>
  <body>
    <div id="title">
      <a href="../../">Codevember</a><strong>12 Feather</strong>
    </div>
    <p id="hint">
      Click it and it puffs up. Press and hold to blow air through its coat.
      Drag to turn it. R for a new one.
    </p>
    <div id="buttons">
      <button id="random" type="button">Random</button>
    </div>
    <div id="controls"></div>
  </body>
</html>
