<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 — tangle</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141311; color: #d6d1c8; font: 11px/1.4 ui-sans-serif, system-ui, sans-serif; }
      canvas { position: fixed; inset: 0; display: block; }
      #views { position: fixed; inset: 0 0 34px 0; display: grid; touch-action: none; }
      .view { position: relative; outline: 1px solid #fff1; pointer-events: none; }
      .label { position: absolute; left: 8px; top: 6px; right: 8px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; pointer-events: auto; width: max-content; max-width: calc(100% - 16px); }
      .label:empty { display: none; }
      .dim { opacity: 0.55; }
      .note { cursor: pointer; font-style: italic; opacity: 0.8; }
      a { color: inherit; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 2px 0; cursor: pointer; opacity: 0.6; }
      button:hover { opacity: 1; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; gap: 16px; padding: 0 14px; letter-spacing: 0.04em; }
      #bar input[type=range] { width: 160px; margin: 0; accent-color: #2b2a28; opacity: 0.7; }
      #info { margin-right: auto; opacity: 0.7; }
      #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: #d6d1c8; color: #141311; padding: 4px 12px; border-radius: 3px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
      #toast.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="views"></div>
    <div id="bar"><span id="info"></span></div>
    <div id="toast"></div>
    <!-- lets the folder run as-is on any static server, without the vite build;
         keep the version in sync with package.json -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
