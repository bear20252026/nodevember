<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { LightProbeGenerator } from 'three/addons/lights/LightProbeGenerator.js';

/* =====================================================================================
   STEPPING STONES - a fox hopping forever along five floating islands.
   WebGL2, three r186, every shader is our own (GLSL3). No built-in shader chunk is
   patched; the only chunk used is three's PMREM sampler (cube_uv_reflection_fragment).
   Pipeline: sky bake (PMREM with sun + SH with sun hidden) -> PCSS sun shadow map ->
   MRT main pass (HDR colour, normal+id, indirect) -> GTAO + one bounce (half res) ->
   composite (contact shadows, AO, aerial perspective, low mist, CoC) -> spiral bokeh DOF
   (half res) -> energy-preserving bloom -> AgX, grade, grain, dither.
   ===================================================================================== */

const Q = new URLSearchParams(location.search);
const MSAA = Q.has('msaa') ? +Q.get('msaa') : 0;          // MSAA on HDR targets: off by default (glitches in headless capture)
let fixedT = Q.has('t') ? +Q.get('t') : null;
const VIEW = Q.get('view') || 'wide';

/* ---------------- loop constants (everything is driven by one time value t) ---------------- */
const H = 2.0;              // one hop, seconds
const NHOP = 5;             // hops per cycle (= number of rocks)
const LOOP = H * NHOP;      // 10 s seamless loop
const S = 1.95;             // slot spacing along the line (m)
const RISE = 0.25;          // each slot is this much higher than the previous
const G = 9.81;
const TAU = Math.PI * 2;

// hop timeline (seconds inside a hop)
const T_CR = 0.30, T_E0 = 0.36, T_TO = 0.448, AIR = 0.50, T_LD = T_TO + AIR;
const T_FL = 0.40, T_FC = 0.925, T_HC = 0.965, T_ST = 1.04;
const SL0 = 0.22, SL1 = 1.12;          // line slide window (smootherstep)
const SW0 = 0.04, SW1 = H + 0.06;      // swing window for the end rock (crosses into next hop)
const VX = (S - 0.30) / AIR;
const VY0 = (RISE - 0.06) / AIR + 0.5 * G * AIR;

const SUN = new THREE.Vector3(0.86, 0.30, -0.44).normalize();
const SUN_E = new THREE.Vector3(1.0, 0.58, 0.29).multiplyScalar(13.0);   // sun irradiance (linear)

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smoother = u => { u = clamp(u, 0, 1); return u * u * u * (u * (u * 6 - 15) + 10); };
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- seeded random + gradient noise for geometry ---------------- */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PERM = new Uint8Array(512); { const r = rng(1337); const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) { const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z, B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(lerp(lerp(grad(PERM[AA] & 15, x, y, z), grad(PERM[BA] & 15, x - 1, y, z), u), lerp(grad(PERM[AB] & 15, x, y - 1, z), grad(PERM[BB] & 15, x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1] & 15, x, y, z - 1), grad(PERM[BA + 1] & 15, x - 1, y, z - 1), u), lerp(grad(PERM[AB + 1] & 15, x, y - 1, z - 1), grad(PERM[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
}
function fbm(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise3(x * f, y * f, z * f); a *= 0.5; f *= 2.03; } return s; }
function worley(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z); let f1 = 9, f2 = 9;
  for (let k = -1; k <= 1; k++) for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const cx = ix + i, cy = iy + j, cz = iz + k;
    const h = Math.sin(cx * 127.1 + cy * 311.7 + cz * 74.7) * 43758.5453, h2 = Math.sin(cx * 269.5 + cy * 183.3 + cz * 246.1) * 43758.5453, h3 = Math.sin(cx * 113.5 + cy * 271.9 + cz * 124.6) * 43758.5453;
    const dx = cx + (h - Math.floor(h)) - x, dy = cy + (h2 - Math.floor(h2)) - y, dz = cz + (h3 - Math.floor(h3)) - z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
  }
  return [f1, f2];
}
function ridged(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { let n = 1 - Math.abs(noise3(x * f + i * 7.1, y * f, z * f)); n *= n; s += n * a; a *= 0.5; f *= 2.13; } return s; }

/* =====================================================================================
   GLSL
   ===================================================================================== */
const GL_NOISE = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
vec3 hash33(vec3 p3){ p3 = fract(p3*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float vnoise(vec3 p){ vec3 i=floor(p); vec3 f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y), f.z); }
float vnoise2(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float fbm3(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
float fbm2(vec2 p){ float a=0.5, s=0.0; for(int i=0;i<6;i++){ s+=a*vnoise2(p); p=p*2.02+vec2(5.3,1.9); a*=0.5; } return s; }
float ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056,0.00583715)))); }
float sat(float x){ return clamp(x,0.0,1.0); }
`;

// shared uniforms (vertex + fragment)
const GL_UNI = /* glsl */`
#define PI 3.141592653589793
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uSH[9];
uniform float uTime; uniform float uLoop; uniform float uPxNdc;
`;

const GL_WIND = /* glsl */`
// loop-periodic breeze: integer harmonics of the 10 s loop so the cycle closes exactly
vec3 windAt(vec3 wp){
  float w = 6.2831853/uLoop; float ph = dot(wp.xz, vec2(0.55,0.25));
  float g = 0.5*sin(4.0*w*uTime - ph*2.0) + 0.3*sin(7.0*w*uTime - ph*3.7 + 1.3) + 0.2*sin(13.0*w*uTime - ph*7.1 + 0.4);
  return vec3(0.83,0.0,-0.55) * (0.35 + 0.65*(0.5+0.5*g));
}
`;

// lighting + outputs (fragment)
const GL_LIGHT = /* glsl */`
uniform sampler2D uEnv; uniform sampler2D uShadow; uniform mat4 uShadowMat; uniform vec4 uShadowP;
#include <cube_uv_reflection_fragment>
vec3 shIrr(vec3 n){
  float x=n.x, y=n.y, z=n.z;
  vec3 r = uSH[0]*0.886227;
  r += uSH[1]*2.0*0.511664*y; r += uSH[2]*2.0*0.511664*z; r += uSH[3]*2.0*0.511664*x;
  r += uSH[4]*2.0*0.429043*x*y; r += uSH[5]*2.0*0.429043*y*z; r += uSH[6]*(0.743125*z*z-0.247708);
  r += uSH[7]*2.0*0.429043*x*z; r += uSH[8]*0.429043*(x*x-y*y);
  return max(r, vec3(0.0));
}
float D_GGX(float a, float NoH){ float a2=a*a; float d=NoH*NoH*(a2-1.0)+1.0; return a2/(PI*d*d); }
float V_SmithCorr(float NoV, float NoL, float a){ float a2=a*a; float gv=NoL*sqrt(NoV*NoV*(1.0-a2)+a2); float gl=NoV*sqrt(NoL*NoL*(1.0-a2)+a2); return 0.5/max(gv+gl,1e-5); }
vec2 envBRDF(float NoV, float r){ const vec4 c0=vec4(-1.0,-0.0275,-0.572,0.022); const vec4 c1=vec4(1.0,0.0425,1.04,-0.04); vec4 rr=r*c0+c1; float a004=min(rr.x*rr.x, exp2(-9.28*NoV))*rr.x+rr.y; return vec2(-1.04,1.04)*a004+rr.zw; }
vec2 vogel(int i, int n, float rot){ float r = sqrt((float(i)+0.5)/float(n)); float th = float(i)*2.39996323 + rot; return r*vec2(cos(th),sin(th)); }

// PCSS: blocker search, penumbra = gap * tan(angular radius), rotated Vogel filter
float sunShadow(vec3 wp, vec3 nrm, int NB, int NF){
  vec3 p = wp + nrm*uShadowP.x*1.6;
  vec4 sc = uShadowMat*vec4(p,1.0);
  vec3 c = sc.xyz;
  if (c.x<0.0||c.y<0.0||c.x>1.0||c.y>1.0||c.z>1.0) return 1.0;
  float zr = c.z;
  float bias = uShadowP.x*1.5/uShadowP.y;
  float rot = ign(gl_FragCoord.xy)*6.2831853;
  float searchUV = 0.06/uShadowP.w;
  float bs=0.0, bn=0.0;
  for(int i=0;i<NB;i++){ float d = texture(uShadow, c.xy + vogel(i,NB,rot)*searchUV).r; if(d < zr-bias){ bs+=d; bn+=1.0; } }
  if (bn < 0.5) return 1.0;
  float gap = (zr - bs/bn)*uShadowP.y;
  float pen = max(gap*uShadowP.z, uShadowP.x*1.2);
  float penUV = pen/uShadowP.w;
  float s=0.0;
  for(int i=0;i<NF;i++){ float d = texture(uShadow, c.xy + vogel(i,NF,rot+1.7)*penUV).r; s += step(zr-bias, d); }
  return s/float(NF);
}

struct Lit { vec3 direct; vec3 indirect; };
// GGX + height-correlated Smith + Schlick, Lambert with wrap, sheen, thin-sheet transmission.
// The sun's specular image lives in the PMREM; the shadowed part of it is removed analytically,
// so reflection, diffuse and shadow all come from one sun and nothing is counted twice.
Lit shade(vec3 albedo, float rough, float f0, vec3 N, vec3 V, float shadow, float ao, float wrap, float sheen, float trans, vec3 transCol){
  vec3 L = uSunDir; vec3 Hh = normalize(L+V);
  float NoLr = dot(N,L); float NoV = max(dot(N,V),1e-3); float NoL = max(NoLr,0.0);
  float NoLw = sat((NoLr+wrap)/((1.0+wrap)*(1.0+wrap)));
  float r = max(rough,0.03); float a = r*r;
  float F = f0 + (1.0-f0)*pow(1.0-max(dot(V,Hh),0.0),5.0);
  float specSun = D_GGX(a, max(dot(N,Hh),0.0))*V_SmithCorr(NoV,NoL,a)*F*NoL;
  vec3 diff = albedo/PI*NoLw*(1.0-f0);
  vec3 sh = sheen*mix(albedo, vec3(1.0), 0.25)*pow(1.0-NoV,4.0)*NoLw*0.5;
  float back = pow(max(dot(-V,L),0.0),5.0);
  vec3 tr = trans*transCol*(0.35*max(-NoLr,0.0) + 1.3*back)/PI;
  Lit o;
  o.direct = uSunCol*shadow*(diff + sh + tr);
  vec2 ab = envBRDF(NoV, r);
  vec3 R = reflect(-V,N);
  vec3 envS = textureCubeUV(uEnv, R, r).rgb*(f0*ab.x+ab.y);
  envS = max(envS - (1.0-shadow)*uSunCol*specSun, vec3(0.0));      // sun glint only where the sun reaches
  vec3 irr = shIrr(N);
  o.indirect = (albedo/PI*irr*(1.0-f0) + trans*transCol*shIrr(-N)/PI*0.35 + sheen*albedo*pow(1.0-NoV,4.0)*irr/PI*0.3)*ao + envS*mix(ao,1.0,0.3);
  return o;
}
vec2 octEnc(vec3 n){ n /= (abs(n.x)+abs(n.y)+abs(n.z)); vec2 s = step(0.0,n.xy)*2.0-1.0; return n.z >= 0.0 ? n.xy : (1.0-abs(n.yx))*s; }
#ifdef DEPTH_PASS
layout(location=0) out vec4 oColor;
#else
layout(location=0) out vec4 oColor;
layout(location=1) out vec4 oNormal;
layout(location=2) out vec4 oAux;
void writeOut(Lit l, vec3 Nw, float id){
  vec3 nv = normalize(mat3(viewMatrix)*Nw);
  oColor = vec4(l.direct + l.indirect, 1.0);
  oNormal = vec4(octEnc(nv), id, 1.0);
  oAux = vec4(l.indirect, 1.0);
}
#endif
`;

/* ---------------- sky: one function for the backdrop, the PMREM bake, the SH bake and the haze ---------------- */
const GL_SKY = /* glsl */`
uniform float uSunOn; uniform float uCloudT;
vec3 skyHaze(vec3 d){
  float y = d.y; float mu = dot(d, uSunDir);
  vec3 zen = vec3(0.030,0.060,0.15);
  vec3 hor = mix(vec3(0.20,0.21,0.27), vec3(0.55,0.36,0.22), 0.5+0.5*dot(normalize(d.xz+1e-4), normalize(uSunDir.xz)));
  float h = pow(1.0-max(y,0.0), 5.0);
  vec3 c = mix(zen, hor, h);
  if (y < 0.0) c = mix(hor, vec3(0.13,0.14,0.19), smoothstep(0.0,-0.5,y));
  float m = max(mu,0.0);
  c += vec3(1.0,0.55,0.25)*(0.35*pow(m,5.0) + 1.2*pow(m,40.0))*(0.3+0.7*h);
  float mh = max(dot(normalize(d.xz+1e-4), normalize(uSunDir.xz)), 0.0);
  c += vec3(0.55,0.30,0.12)*pow(mh, 3.0)*0.32*(1.0 - smoothstep(0.0, -0.7, y)*0.5);
  return c;
}
float cloudField(vec2 p){
  // two drifting phases cross-faded so the drift loops with the 10 s cycle
  float w1 = fract(uCloudT), w2 = fract(uCloudT+0.5);
  float a1 = 1.0-abs(w1*2.0-1.0);
  vec2 dr = vec2(18.0,6.0);
  float f1 = fbm2(p*0.028 + dr*0.028*(w1-0.5) + vec2(3.1,1.7));
  float f2 = fbm2(p*0.028 + dr*0.028*(w2-0.5) + vec2(9.4,4.2));
  return mix(f2, f1, a1);
}
vec3 skyFull(vec3 d, vec3 ro){
  vec3 c = skyHaze(d);
  if (d.y < -0.015){
    float t = (ro.y + 70.0)/(-d.y);
    vec2 P = ro.xz + d.xz*t;
    float f = cloudField(P);
    float e = 2.0;
    float fx = cloudField(P+vec2(e,0.0)) - f, fz = cloudField(P+vec2(0.0,e)) - f;
    vec3 n = normalize(vec3(-fx*30.0, 1.0, -fz*30.0));
    float cov = smoothstep(0.40, 0.60, f);
    float lit = sat(dot(n, normalize(uSunDir*vec3(1.0,0.5,1.0))));
    vec3 cl = mix(vec3(0.07,0.08,0.14), vec3(0.95,0.52,0.24), pow(lit,1.8)) * (0.55 + 0.6*smoothstep(0.4,0.8,f));
    vec3 gap = vec3(0.025,0.035,0.075);
    vec3 below = mix(gap, cl, cov);
    float fog = 1.0 - exp(-t*0.0026);
    c = mix(below, c, fog);
  }
  if (uSunOn > 0.5){
    float mu = dot(d, uSunDir);
    c += vec3(1.0,0.72,0.45)*smoothstep(0.99995, 0.99998, mu)*14000.0;
    c += vec3(1.0,0.65,0.35)*pow(max(mu,0.0), 900.0)*20.0;
  }
  return c;
}
`;

/* ---------------- renderer ---------------- */
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.autoClear = false;
const dpr = renderer.getPixelRatio();
const SS = dpr < 1.5 ? 1.5 : 1.0;    // supersample when the display is 1x

/* ---------------- shared uniform objects ---------------- */
const U = {
  uSunDir: { value: SUN.clone() }, uSunCol: { value: SUN_E.clone() }, uSH: { value: Array.from({ length: 9 }, () => new THREE.Vector3()) },
  uTime: { value: 0 }, uLoop: { value: LOOP }, uEnv: { value: null }, uShadow: { value: null }, uShadowMat: { value: new THREE.Matrix4() },
  uShadowP: { value: new THREE.Vector4(0.003, 40, Math.tan(1.1 * Math.PI / 180), 12) }, uSunOn: { value: 1 }, uCloudT: { value: 0 }, uPxNdc: { value: 0.001 },
};
let ENV_DEFINES = {};

function makeMat(vs, fs, uniforms, o = {}) {
  const base = {
    glslVersion: THREE.GLSL3, vertexShader: vs, fragmentShader: fs, uniforms,
    defines: Object.assign({}, ENV_DEFINES, o.defines || {}),
    side: o.side ?? THREE.FrontSide, depthWrite: o.depthWrite ?? true, depthTest: o.depthTest ?? true,
  };
  const m = new THREE.ShaderMaterial(Object.assign({}, base, o.transparent ? {
    transparent: true, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
  } : { blending: THREE.NoBlending }));
  if (o.shadow) {
    m.userData.depth = new THREE.ShaderMaterial(Object.assign({}, base, {
      defines: Object.assign({}, base.defines, { DEPTH_PASS: 1 }), blending: THREE.NoBlending, side: THREE.DoubleSide, depthWrite: true, transparent: false,
    }));
  }
  return m;
}

/* =====================================================================================
   SKY BAKE: PMREM with the sun, SH (9 coefficients) with the sun hidden
   ===================================================================================== */
const SKY_VS = /* glsl */`
out vec3 vWorld;
void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vWorld = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; gl_Position.z = gl_Position.w*0.999999; }`;
const SKY_FS = /* glsl */`
${GL_UNI}
${GL_NOISE}
${GL_SKY}
in vec3 vWorld;
layout(location=0) out vec4 oColor;
#ifdef MRT
layout(location=1) out vec4 oNormal;
layout(location=2) out vec4 oAux;
#endif
void main(){
  vec3 d = normalize(vWorld - cameraPosition);
  vec3 c = skyFull(d, cameraPosition);
  oColor = vec4(c,1.0);
#ifdef MRT
  oNormal = vec4(0.0,0.0,0.0,1.0); oAux = vec4(0.0,0.0,0.0,1.0);
#endif
}`;

async function bakeSky() {
  const skyScene = new THREE.Scene();
  const m = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: SKY_VS, fragmentShader: SKY_FS, uniforms: U, side: THREE.BackSide, depthWrite: false });
  skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 64, 32), m));
  U.uSunOn.value = 1;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envRT = pmrem.fromScene(skyScene, 0, 0.1, 1000);
  U.uEnv.value = envRT.texture;
  const hgt = envRT.texture.image.height;
  const maxMip = Math.log2(hgt) - 2;
  ENV_DEFINES = {
    ENVMAP_TYPE_CUBE_UV: 1,
    CUBEUV_TEXEL_WIDTH: (1.0 / (3 * Math.max(Math.pow(2, maxMip), 7 * 16))).toFixed(10),
    CUBEUV_TEXEL_HEIGHT: (1.0 / hgt).toFixed(10),
    CUBEUV_MAX_MIP: maxMip.toFixed(1),
  };
  // SH from a second bake with the sun hidden: the sun is the analytic, shadow-casting light
  U.uSunOn.value = 0;
  const cubeRT = new THREE.WebGLCubeRenderTarget(64, { type: THREE.HalfFloatType });
  const cubeCam = new THREE.CubeCamera(0.1, 1000, cubeRT);

/* ---------------- thin things: grass blades, flowers (stems + petals / spikelets), sapling leaves ---------------- */
const THIN_VS = /* glsl */`
${GL_UNI}
${GL_WIND}
in vec3 iPos; in vec4 iA; in vec4 iB; in vec3 iC;
in vec2 aPart;

out vec3 vWorld; out vec3 vNw; out vec2 vBl; out vec4 vB; out vec3 vCol; out float vPart; out float vTip;
vec3 bez(vec3 a, vec3 b, vec3 c, float t){ return mix(mix(a,b,t), mix(b,c,t), t); }
void main(){
  float hgt = iA.x, wid = iA.y, lean = iA.z, az = iA.w;
  vec3 dir = vec3(cos(az), 0.0, sin(az));
  vec3 rootW = (modelMatrix*vec4(iPos,1.0)).xyz;
  vec3 wL = transpose(uRot)*windAt(rootW);

  vec2 dq = (iPos.xz - uPress.xy)/uPressR; float pr = uPress.w*(1.0-smoothstep(0.5,1.15,length(dq)));
  vec2 away = iPos.xz - uPress.xy; away /= max(length(away),1e-4);
  float wob = sin(uTime*6.2831853*(9.0/uLoop) + iB.w*40.0)*0.06;
  vec2 bend = dir.xz*lean*(1.0-pr) + away*1.35*pr + wL.xz*(0.38+wob)*flex*(1.0-pr);
  float ang = length(bend); vec3 bd = ang > 1e-4 ? vec3(bend.x,0.0,bend.y)/ang : dir;
  float L = hgt*(1.0-0.2*pr);
  vec3 up = vec3(0.0,1.0,0.0);
  float bendK = min(ang/1.4, 1.0);
  vec3 p0 = iPos;
  vec3 p2 = p0 + L*normalize(up*cos(ang*0.82)+bd*sin(ang*0.82))*mix(1.0,0.80,bendK);
  vec3 p1 = p0 + up*L*0.5*mix(1.0,0.55,bendK);

    // blade / stem
    float y = position.y, s = position.x;
    vec3 c = bez(p0,p1,p2,y);
    vec3 tng = normalize(mix(p1-p0, p2-p1, y));
    float tw = iB.w*6.2831853;
    vec3 sideV = normalize(cross(tng, vec3(cos(tw),0.0,sin(tw))));
    float w = iB.y > 1.5 ? wid*pow(max(sin(3.14159*y),0.0),0.75) : wid*(1.0 - pow(y, 1.5)*0.93);
    pos = c + sideV*s*w;
    nrm = normalize(cross(sideV, tng) + sideV*s*1.4);
    vBl = vec2(s, y); vTip = y;
  } else {

    vec3 head = p2;
    vec3 tng = normalize(p2-p1);

        nrm = hn; vBl = position.xy;

        vec3 hn = normalize(up*0.6 + normalize(vec3(uSunL.x,0.0,uSunL.z))*0.45 + tng*0.3);
        vec3 u1 = normalize(cross(hn, vec3(0.3,0.1,1.0))); vec3 u2 = cross(hn,u1);
        float a = k*6.2831853/np + iB.w*6.28;
        vec3 dk = cos(a)*u1 + sin(a)*u2; vec3 pk = cross(hn, dk);

        vBl = vec2(position.x, yy);

      // grass seed head: spikelets set round the stalk at the golden angle
      if (part > 1.5) { gl_Position = vec4(2.0,2.0,2.0,1.0); return; }
      float a = k*2.39996323 + iB.w*6.28;
      float along = 1.0 - k*0.07;
      vec3 c = bez(p0,p1,p2,along);

      float yy = position.y;
      pos = c + sd*yy*pl + pk*position.x*pw*sin(yy*3.14159+0.3);

  vec4 wp = modelMatrix*vec4(pos,1.0); vWorld = wp.xyz; vNw = normalize(mat3(modelMatrix)*nrm);

const THIN_FS = /* glsl */`
${GL_UNI}
${GL_NOISE}
${GL_LIGHT}
uniform float uId; uniform vec3 uPetal; uniform vec3 uCentre; uniform float uDry;
in vec3 vWorld; in vec3 vNw; in vec2 vBl; in vec4 vB; in vec3 vCol; in float vPart; in float vTip;

  }

  Lit l = shade(albedo, rough, 0.045, N, V, sh, ao, 0.3, sheen, trans, tcol);

#endif
}`;

vec3 qrot(vec4 q, vec3 v){ return v + 2.0*cross(q.xyz, cross(q.xyz, v) + q.w*v); }
void main(){

    base += vec3(iFall.z*tf, -0.5*9.81*tf*tf, iFall.w*tf);

void main(){

    float k1 = floor(1.0+iSeed.w*3.0), k2 = floor(1.0+iSeed2.x*2.0);

    mat4 F = second ? uFrame2 : uFrame;

    alpha = 0.55*exp(-age*1.8)*smoothstep(0.0, 0.04, age)*(second ? 0.6 : 1.0);

// tapered tube generator with an along-coordinate attribute
function tubeGeometry(curves, radial = 6) {

}
