<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caustic pool</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      body {
        background: #8fd0e8;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      }
      canvas {
        display: block;
        cursor: crosshair;
        touch-action: none;
      }
      #tray {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 6px 24px rgba(10, 60, 90, 0.25);
        backdrop-filter: blur(8px);
        user-select: none;
      }
      #tray button {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 0;
        border-radius: 999px;
        padding: 6px 13px 6px 8px;
        background: transparent;
        color: #20506a;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      #tray button:hover {
        background: rgba(120, 210, 235, 0.25);
      }
      #tray button.on {
        background: #fff;
        box-shadow: inset 0 0 0 2px #5cc8e6;
      }
      #tray svg {
        width: 22px;
        height: 22px;
      }
      #hint {
        position: fixed;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        color: #20506a;
        font-size: 14px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 4px 16px rgba(10, 60, 90, 0.18);
        transition: opacity 1.2s;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hint">click the water to throw · drag to stir</div>
    <div id="tray">
      <button data-kind="ball" class="on" title="beach ball (1)">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="#fff" stroke="#20506a" stroke-width="1.5" />
          <path d="M12 2a10 10 0 0 0-6 18l6-8z" fill="#f2545b" />
          <path d="M12 2a10 10 0 0 1 9 6l-9 4z" fill="#ffd23f" />
          <path d="M21 8a10 10 0 0 1-3 12l-6-8z" fill="#3f7fe8" />
          <circle cx="12" cy="12" r="10" fill="none" stroke="#20506a" stroke-width="1.5" />
        </svg>
        ball
      </button>
      <button data-kind="stone" title="stone (2)">
        <svg viewBox="0 0 24 24">
          <ellipse cx="12" cy="13" rx="9.5" ry="6.5" fill="#8a9aa0" stroke="#20506a" stroke-width="1.5" />
          <ellipse cx="9" cy="11" rx="3.5" ry="1.6" fill="#b9c6ca" />
        </svg>
        stone
      </button>
      <button data-kind="marble" title="glass marble (3)">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="#bdf1f0" stroke="#20506a" stroke-width="1.5" />
          <path d="M7 14c3-1 5 2 9-1" stroke="#36b3c9" stroke-width="2" fill="none" stroke-linecap="round" />
          <circle cx="9" cy="8.5" r="2" fill="#fff" />
        </svg>
        marble
      </button>
      <button data-kind="petal" title="petals (4)">
        <svg viewBox="0 0 24 24">
          <path d="M12 21C6 16 5 9 8 4c1.5 1 2.5 2.2 4 3.5C13.5 6.2 14.5 5 16 4c3 5 2 12-4 17z" fill="#ffc4d6" stroke="#20506a" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M12 19c-1.5-3-1.8-6-1-9" stroke="#f58fb0" stroke-width="1.4" fill="none" stroke-linecap="round" />
        </svg>
        petals
      </button>
      <button data-kind="clear" title="empty the pool">
        <svg viewBox="0 0 24 24">
          <path d="M5 13c2-2 4 2 7 0s5-2 7 0" stroke="#3aa6c8" stroke-width="2" fill="none" stroke-linecap="round" />
          <path d="M5 17c2-2 4 2 7 0s5-2 7 0" stroke="#3aa6c8" stroke-width="2" fill="none" stroke-linecap="round" />
        </svg>
        calm
      </button>
    </div>
    <script type="module" src="./src/pool/index.ts"></script>
  </body>
</html>
